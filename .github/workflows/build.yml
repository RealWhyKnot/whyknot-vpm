name: Publish VPM Listing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the zips against index.json
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          foreign=$(jq -r --arg base "https://vpm.whyknot.dev/packages/" \
            '.packages[].versions[].url | select(startswith($base) | not)' site/index.json)
          if [[ -n ${foreign} ]]; then
            printf 'index.json has a zip url outside this site: %s\n' "${foreign}" >&2
            exit 1
          fi
          checksums=$(jq -r '.packages[].versions[] | "\(.zipSHA256)  site/packages/\(.url | sub(".*/"; ""))"' site/index.json)
          printf '%s\n' "${checksums}" | sha256sum --check --quiet
          listed=$(printf '%s\n' "${checksums}" | wc -l)
          stored=$(find site/packages -name '*.zip' | wc -l)
          if [[ ${listed} -ne ${stored} ]]; then
            printf 'index.json lists %s zips, site/packages holds %s\n' "${listed}" "${stored}" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
